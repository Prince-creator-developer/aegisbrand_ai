<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AegisBrand AI</title>
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 14px;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .logo {
      font-weight: 800;
      font-size: 15px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      background: #064e3b;
      color: #34d399;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #059669;
    }
    .status-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .status-title {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 700;
    }
    .status-val {
      font-size: 18px;
      font-weight: 800;
      color: #10b981;
      margin-top: 2px;
    }
    .btn {
      width: 100%;
      background: #4f46e5;
      color: #ffffff;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      display: block;
      text-align: center;
      text-decoration: none;
      margin-top: 8px;
    }
    .btn:hover { background: #4338ca; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🛡️ AegisBrand AI</div>
    <div class="badge">In-Situ Active</div>
  </div>
  <div class="status-card">
    <div class="status-title">Real-Time Workspace Guard</div>
    <div class="status-val">Active on Tab</div>
    <div style="font-size: 11px; color: #cbd5e1; margin-top: 4px;">
      Monitoring Google Docs, Notion & Figma text spans for unverified claims & off-brand tone.
    </div>
  </div>
  <a href="https://aegisbrand-ai.vercel.app" target="_blank" class="btn">Open Full Governance Suite ➔</a>
</body>
</html>
